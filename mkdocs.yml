site_name: PhotoPrism for Mere Mortals
site_description: A self-hosted photo library that indexes the folder you already have. Reading dates, places and labels out of your files, finding faces with models on your own machine, and serving a searchable web app, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/photoprism-for-mere-mortals/
